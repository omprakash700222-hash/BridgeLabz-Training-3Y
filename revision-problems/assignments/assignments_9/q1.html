<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Filter Gallery</h1>

    <div class="gallery">

        <div class="image-box">
            <img class="blur" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Nature">
            <p>Blur</p>
        </div>

        <div class="image-box">
            <img class="grayscale" src="https://images.unsplash.com/photo-1511497584788-876760111969" alt="Forest">
            <p>Grayscale</p>
        </div>

        <div class="image-box">
            <img class="sepia" src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Mountain">
            <p>Sepia</p>
        </div>

        <div class="image-box">
            <img class="brightness" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">
            <p>Brightness</p>
        </div>

        <div class="image-box">
            <img class="contrast" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" alt="Lake">
            <p>Contrast</p>
        </div>

        <div class="image-box">
            <img class="hue" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Trees">
            <p>Hue Rotate</p>
        </div>

    </div>

</body>
</html>
