<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Our Team</h1>

<div class="profiles">

    <div class="profile">
        <img class="grayscale"
             src="https://i.pravatar.cc/300?img=12"
             alt="Rahul">
        <h2>Rahul</h2>
        <p>Web Developer</p>
    </div>

    <div class="profile">
        <img class="sepia"
             src="https://i.pravatar.cc/300?img=32"
             alt="Aman">
        <h2>Aman</h2>
        <p>UI Designer</p>
    </div>

    <div class="profile">
        <img class="grayscale"
             src="https://i.pravatar.cc/300?img=47"
             alt="Rohit">
        <h2>Rohit</h2>
        <p>Software Engineer</p>
    </div>

</div>

</body>
</html>
