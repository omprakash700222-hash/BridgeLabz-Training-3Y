<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2: CSS Tooltips</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
    <header>
        <h1>CSS Tooltips Demonstration</h1>
    </header>
    <main class="wrapper">
        <section class="tooltip-container">
            <!-- Tooltip Item 1 -->
            <div class="tooltip-item">
                <span class="target">Hover Word</span>
                <span class="tooltip-box">This is a text tooltip!</span>
            </div>

            <!-- Tooltip Item 2 -->
            <div class="tooltip-item">
                <span class="target icon">&#9733; Star Icon</span>
                <span class="tooltip-box">Favorite item tooltip</span>
            </div>

            <!-- Tooltip Item 3 -->
            <div class="tooltip-item">
                <span class="target">Hover Button</span>
                <span class="tooltip-box">Action description tooltip</span>
            </div>
        </section>
    </main>
    <footer>
        <p>Assignment Submission &copy; 2026</p>
    </footer>
</body>
</html>
