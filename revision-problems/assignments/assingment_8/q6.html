<html lang="en">
<head>

    <title>Q6: CSS Animations</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <header>
        <h1>CSS Keyframe Animations</h1>
    </header>

    <main class="stage">
        <!-- Animated Element 1: Moving Box -->
        <div class="card">
            <h3>Moving Box</h3>
            <div class="animated-box"></div>
        </div>

        <!-- Animated Element 2: Bouncing Ball -->
        <div class="card">
            <h3>Bouncing Ball</h3>
            <div class="bouncing-ball"></div>
        </div>

        <!-- Animated Element 3: Color Shift Text -->
        <div class="card">
            <h3>Color Shift</h3>
            <h2 class="color-text">FLASHING</h2>
        </div>
    </main>
