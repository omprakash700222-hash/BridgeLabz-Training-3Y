<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q10: Mini UI Layout</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

    <header class="app-header">
        <h1>Mini Dashboard UI</h1>
    </header>

    <main class="app-body">
        <section class="profile-card">
            <div class="avatar-container">
                <img src="https://picsum.photos/100/100" alt="User Profile" class="profile-img">
            </div>

            <form class="user-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Save Profile</button>
                    <button type="reset" class="btn btn-cancel">Cancel</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="app-footer">
        <p>Assignment Submission &copy; 2026</p>
    </footer>

</body>
</html>
