<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3: Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header>
        <h1>Image Showcase Gallery</h1>
    </header>
    <main class="gallery-container">
        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://picsum.photos/400/300?random=1" alt="Showcase Image 1">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://picsum.photos/400/300?random=2" alt="Showcase Image 2">
                <div class="overlay"></div>
            </div>
            <figcaption>Ocean Breeze</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://picsum.photos/400/300?random=3" alt="Showcase Image 3">
                <div class="overlay"></div>
            </div>
            <figcaption>Forest Path</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://picsum.photos/400/300?random=4" alt="Showcase Image 4">
                <div class="overlay"></div>
            </div>
            <figcaption>Desert Dunes</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://picsum.photos/400/300?random=5" alt="Showcase Image 5">
                <div class="overlay"></div>
            </div>
            <figcaption>City Lights</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://picsum.photos/400/300?random=6" alt="Showcase Image 6">
                <div class="overlay"></div>
            </div>
            <figcaption>Sunset Glow</figcaption>
        </figure>
    </main>
    <footer>
        <p>Assignment Submission &copy; 2026</p>
    </footer>
</body>
</html>
